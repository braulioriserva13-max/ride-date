<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f0e8"><title>RE-UNITED / PHILLIBOYS — Log the date</title><style>
:root{--paper:#f3f0e8;--ink:#11110f;--green:#d7ff37;--blue:#3157ff;--pad:clamp(16px,2.65vw,52px);--columns:24;--unit:calc((100vw - 2 * var(--pad))/var(--columns))}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.65}a{color:inherit;text-decoration:none}
.topbar{height:62px;padding:0 var(--pad);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--ink);background:var(--paper);position:sticky;top:0;z-index:20}
.brand{font-size:clamp(13px,1.45vw,22px);white-space:nowrap;letter-spacing:-.04em}.brand strong{font-weight:900}.brand span{font-weight:400;margin-left:7px}.login-button{height:100%;padding:0 clamp(14px,2vw,26px);border:0;border-left:1px solid var(--ink);border-right:1px solid var(--ink);background:var(--paper);font:700 13px 'Courier New',monospace;white-space:nowrap}.login-button:hover,.login-button:focus-visible{background:var(--ink);color:var(--paper)}
.hero{min-height:380px;padding:37px var(--pad) 40px;display:grid;grid-template-columns:repeat(24,1fr);grid-template-rows:auto 1fr auto;border-bottom:1px solid var(--ink);background-image:radial-gradient(circle,rgba(17,17,15,.18) 1px,transparent 1.2px);background-size:32px 32px}
.eyebrow,.hero-edition,.section-heading,.legend,.date-editor label,.date-editor button,.date-editor small,.date-tile>span,.status,footer,.login-dialog label,.login-dialog .enter{font-family:'Courier New',monospace;font-weight:700;letter-spacing:.03em;font-size:13px}.hero .eyebrow{grid-column:1/9}.hero-edition{grid-column:20/25;text-align:right}.hero h1{grid-column:1/23;align-self:center;margin:15px 0;font-size:clamp(5.2rem,11vw,13rem);line-height:.77;letter-spacing:-.095em;font-weight:900}.hero p{grid-column:1/11;margin:0;max-width:600px;font-size:clamp(16px,1.45vw,22px);line-height:1.23}
.calendar{padding:50px var(--pad) 45px;border-bottom:1px solid var(--ink)}.section-heading{display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--ink);padding-top:15px}.date-grid{display:grid;grid-template-columns:repeat(var(--columns),minmax(0,1fr));grid-template-rows:repeat(12,var(--unit));margin-top:45px;background-image:radial-gradient(circle,rgba(17,17,15,.23) 1px,transparent 1.3px);background-size:var(--unit) var(--unit);position:relative}
.date-tile{width:var(--unit);height:var(--unit);border:1px solid var(--ink);background:var(--paper);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:5px;line-height:1;position:relative;z-index:1}.date-tile b{font-size:clamp(22px,3vw,42px);font-weight:900;letter-spacing:-.08em}.date-tile.active{outline:2px solid var(--ink);outline-offset:3px}.date-tile.mine{background:var(--green)}.date-tile.shared{background:#a8e527}.date-tile:hover{background:var(--ink);color:var(--paper)}.legend{display:flex;gap:24px;flex-wrap:wrap;margin-top:24px}.legend span{display:flex;align-items:center;gap:8px}.legend i{width:14px;height:14px;border:1px solid var(--ink);display:inline-block}.legend i.selected{background:var(--green)}.legend i.common{background:#a8e527}
.details{padding:58px var(--pad) 80px}.details-layout{display:grid;grid-template-columns:1fr minmax(290px,32%);gap:40px;margin-top:50px}.details h2{font-size:clamp(3.5rem,8vw,9rem);line-height:.82;letter-spacing:-.09em;text-transform:uppercase;margin:0;overflow-wrap:anywhere}.details p{font-size:20px;line-height:1.25;max-width:480px}.date-editor{display:flex;flex-direction:column;gap:14px;align-self:start}.date-editor input,.login-dialog input{height:56px;border:1px solid var(--ink);border-radius:0;background:transparent;padding:0 15px;min-width:0;color:var(--ink)}.date-editor button,.login-dialog .enter{min-height:55px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);text-align:left;padding:0 16px}.date-editor button:hover,.login-dialog .enter:hover{background:var(--green);color:var(--ink)}.date-editor small{font-size:12px;font-weight:400;line-height:1.35}.status{min-height:1.3em;margin-top:32px;font-weight:400}footer{display:flex;justify-content:space-between;gap:20px;background:var(--ink);color:var(--paper);padding:35px var(--pad)}
.modal-backdrop{position:fixed;inset:0;background:rgba(17,17,15,.65);z-index:30;display:grid;place-items:center;padding:16px}.login-dialog{width:min(100%,520px);padding:34px;background:var(--paper);position:relative;display:flex;flex-direction:column;gap:14px}.login-dialog h2{font-size:clamp(3.5rem,10vw,6rem);line-height:.8;letter-spacing:-.085em;margin:40px 0 25px}.login-dialog .close{position:absolute;right:15px;top:12px;background:transparent;border:0;font-size:36px;line-height:1}.login-dialog p{font-size:14px;line-height:1.4;margin:7px 0 0}
@media(max-width:760px){:root{--columns:6}.topbar{height:60px}.brand{font-size:clamp(12px,3.6vw,17px)}.brand span{margin-left:5px}.login-button{font-size:11px;padding:0 9px}.hero{min-height:340px;grid-template-columns:repeat(6,1fr);padding-top:30px}.hero .eyebrow{grid-column:1/4}.hero-edition{grid-column:5/7;font-size:11px}.hero h1{grid-column:1/7;font-size:clamp(4rem,18vw,7rem);line-height:.81;margin:30px 0 20px}.hero p{grid-column:1/7;max-width:360px;font-size:16px}.calendar{padding-top:36px}.date-grid{margin-top:38px}.date-tile{padding:4px}.date-tile>span{font-size:11px}.date-tile b{font-size:clamp(25px,8vw,34px)}.legend{font-size:10px;gap:8px 18px;margin-top:22px}.legend i{width:12px;height:12px}.details{padding-top:45px}.details-layout{display:block;margin-top:50px}.details h2{font-size:clamp(3.7rem,15vw,6rem)}.details p{font-size:17px}.date-editor{margin-top:50px}.status{font-size:12px}footer{font-size:11px;align-items:end}footer span{text-align:right;max-width:140px}}
@media(max-width:350px){.brand{font-size:11px}.login-button{font-size:10px}.hero h1{font-size:17vw}}

.grid-note{grid-column:9/span 8;grid-row:1/span 2;align-self:start;z-index:1;margin:0;padding:4px 0;font:400 clamp(18px,2vw,30px)/1.16 Arial,Helvetica,sans-serif;letter-spacing:-.03em;pointer-events:none}@media(max-width:760px){.grid-note{grid-column:3/span 4;grid-row:2/span 2;font-size:clamp(15px,4.1vw,20px);padding:2px 4px}}.grid-numbers{position:absolute;inset:0;display:grid;grid-template-columns:repeat(24,minmax(0,1fr));grid-template-rows:repeat(16,var(--unit));pointer-events:none;z-index:0}.grid-number{padding:3px 4px;font:9px/1 'Courier New',monospace;color:rgba(49,87,255,.7);min-width:0}.date-tile{z-index:1}@media(max-width:760px){.grid-numbers{grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(19,var(--unit))}.grid-number{font-size:9px;padding:2px 3px}}body.grid-on .hero,body.grid-on .calendar{background-image:linear-gradient(to right,rgba(49,87,255,.23) 1px,transparent 1px),linear-gradient(to bottom,rgba(49,87,255,.23) 1px,transparent 1px);background-size:var(--unit) var(--unit);background-position:var(--pad) 0}.date-grid{background-image:none!important}.topbar .login-button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}.hero{border-bottom:0}.calendar{border-top:0}.date-grid{grid-template-rows:repeat(16,var(--unit));background-image:none}.date-tile{width:auto;height:auto;grid-column:var(--col)/span 2;grid-row:var(--row)/span 2;padding:clamp(8px,1vw,18px)}.date-tile b{font-size:clamp(17px,2.1vw,32px);letter-spacing:-.06em;text-align:left}.date-tile.mine{background:var(--green)}.date-tile.mine b{font-size:clamp(12px,1.8vw,28px);letter-spacing:-.04em;line-height:1.1}.date-tile:hover{background:var(--ink);color:var(--paper)}.date-tile.mine:hover{background:var(--green);color:var(--ink)}.calendar .status{margin:25px 0 0}.calendar{min-height:calc(100vh - 62px)}@media(max-width:760px){.date-grid{grid-template-rows:repeat(19,var(--unit))}.date-tile{grid-column:var(--mobile-col)/span 2;grid-row:var(--mobile-row)/span 2;padding:7px}.date-tile b{font-size:clamp(17px,4.8vw,25px)}.date-tile.mine b{font-size:clamp(12px,3.7vw,18px)}.date-tile>span{font-size:11px}}
</style></head><body><main id="top">
<header class="topbar"><a class="brand" href="#top"><strong>RE-UNITED</strong><span>/PHILLIBOYS</span></a><button class="login-button" id="grid-toggle" aria-pressed="true">GRID ON</button></header>
<section class="hero"><span class="eyebrow">/ RIDE TOGETHER</span><span class="hero-edition">SIX WINDOWS<br>ONE RIDE</span><h1>LOG THE<br>DATE.</h1><p>Das sind die Tage, an denen ich kann. Tippe auf deine passenden Termine und schick mir deine Auswahl.</p></section>
<section class="calendar" id="dates"><div class="date-grid" id="date-grid" aria-label="Terminraster"><div class="grid-numbers" id="grid-numbers" aria-hidden="true"></div><p class="grid-note">weißwurstfrühstück vorab</p></div><div class="legend"><span><i></i>OFFEN</span><span><i class="selected"></i>LET’S RIDE</span></div><p class="status" id="status" role="status"></p></section>
<footer>RE-UNITED / PHILLIBOYS <span>GOOD RIDES START WITH A DATE.</span></footer></main><script>
(() => {
const cells=[
 {cell:'B5',date:'10.10.',row:2,col:5,mrow:1,mcol:1},
 {cell:'D4',date:'24.10.',row:4,col:4,mrow:4,mcol:4},
 {cell:'H2',date:'31.10.',row:8,col:2,mrow:7,mcol:1},
 {cell:'I3',date:'14.11.',row:10,col:3,mrow:10,mcol:4},
 {cell:'G6',date:'21.11.',row:7,col:6,mrow:13,mcol:1},
 {cell:'K3',date:'28.11.',row:13,col:3,mrow:16,mcol:4}
];
const key='reunited-philliboys-html-v2';let state={selected:{}};
try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&typeof saved==='object'&&saved.selected&&typeof saved.selected==='object')state.selected=saved.selected;}catch(_){}
const el=id=>document.getElementById(id);
function persist(){try{localStorage.setItem(key,JSON.stringify(state));}catch(_){el('status').textContent='Speichern im Browser nicht verfügbar.';}}
function render(){el('date-grid').querySelectorAll('.date-tile').forEach(tile=>tile.remove());el('date-grid').append(...cells.map(({cell,date,row,col,mrow,mcol})=>{
 const tile=document.createElement('button');tile.type='button';tile.className='date-tile'+(state.selected[cell]?' mine':'');
 tile.style.setProperty('--row',row);tile.style.setProperty('--col',col);tile.style.setProperty('--mobile-row',mrow);tile.style.setProperty('--mobile-col',mcol);
 tile.setAttribute('aria-pressed',state.selected[cell]?'true':'false');tile.setAttribute('aria-label',date+' — '+(state.selected[cell]?'Let’s ride':'nicht markiert'));
 const value=document.createElement('b');value.textContent=state.selected[cell]?'LET’S RIDE':date;
 tile.append(value);tile.addEventListener('click',()=>{state.selected[cell]=!state.selected[cell];persist();render();el('status').textContent=state.selected[cell]?date+' — Let’s ride!':date+' — Auswahl entfernt.';});return tile;
}));}
function numberGrid(){const narrow=matchMedia('(max-width:760px)').matches;const count=narrow?6*19:24*16;const fragment=document.createDocumentFragment();for(let i=1;i<=count;i++){const number=document.createElement('span');number.className='grid-number';number.textContent=String(i).padStart(3,'0');fragment.append(number);}el('grid-numbers').replaceChildren(fragment);}
let numberedNarrow=matchMedia('(max-width:760px)').matches;numberGrid();addEventListener('resize',()=>{const narrow=matchMedia('(max-width:760px)').matches;if(narrow!==numberedNarrow){numberedNarrow=narrow;numberGrid();}});
document.body.classList.add('grid-on');
el('grid-toggle').addEventListener('click',()=>{const on=document.body.classList.toggle('grid-on');el('grid-numbers').hidden=!on;el('grid-toggle').textContent=on?'GRID ON':'GRID OFF';el('grid-toggle').setAttribute('aria-pressed',String(on));});render();
})();
</script></body></html>
